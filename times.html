<style>@media (max-width:1500px){ .page-toggle a{padding:8px 14px} .page-toggle .pg{display:none} } @media (max-width:1100px){ .page-toggle{flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px);border-radius:18px} .page-toggle a{padding:8px 12px} }</style>
<style>
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1100px){ .grid3{grid-template-columns:1fr} }
@media (max-width:1100px){ .tiles4[style]{grid-template-columns:repeat(2,minmax(0,1fr))!important} }
.ph{margin:0 0 6px;font-size:14px} .ph2{margin:14px 0 6px;font-size:12.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em}
.bucard .big small{font-size:13px;margin-left:6px}
.wfl{margin:10px 0 4px;font-size:12px}
.wfl .r{display:grid;grid-template-columns:150px 1fr 56px;gap:8px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--line)}
.wfl .r span{color:var(--ink-soft);display:flex;align-items:center;gap:6px} .wfl .r span i{width:8px;height:8px;border-radius:2px;display:inline-block}
.wfl .r em{position:relative;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.wfl .r em u{position:absolute;top:0;bottom:0;border-radius:99px} .wfl .r em u.pos{left:50%;background:var(--good);max-width:50%} .wfl .r em u.neg{right:50%;background:var(--crit);max-width:50%}
.wfl .r b{text-align:right;font-family:var(--font-mono)} .wfl .r b.up{color:var(--good)} .wfl .r b.down{color:var(--crit)}
.wfl .r.tot{border-bottom:none;font-weight:700} .wfl .r.tot span{color:var(--ink)} .wfl .r:first-child,.wfl .r.tot{grid-template-columns:1fr 56px}
.vtxt{font-size:12.5px;line-height:1.5;margin:10px 0 0}
tr.sub td{font-size:11.5px}
.stack>.panel{margin-bottom:14px}
</style>
